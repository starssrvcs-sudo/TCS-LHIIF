<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learner Health & Illness Information Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }
    h2 { margin-top: 0; color: #2c3e50; text-align: center; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; }
    input[type="text"], input[type="date"], select {
      width: 100%; padding: 10px; border: 1px solid #ccc;
      border-radius: 6px; box-sizing: border-box; font-size: 14px;
      background-color: #fff;
    }
    input:focus, select:focus { border-color: #3498db; outline: none; }
    .row-group {
      display: flex;
      gap: 10px;
    }
    .row-group .form-group {
      flex: 1;
    }
    button {
      width: 100%; background-color: #27ae60; color: white;
      padding: 12px; border: none; border-radius: 6px;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:hover { background-color: #219150; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
    .success { color: #27ae60; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Learner Health & Illness Form</h2>
    <form id="healthForm">
      
      <div class="form-group">
        <label for="learnerName">Name of Learner</label>
        <input type="text" id="learnerName" name="learnerName" placeholder="Full Name" required>
      </div>

      <!-- Grade Level Dropdown (Kinder to Grade 7) -->
      <div class="form-group">
        <label for="gradeLevelSelect">Grade Level</label>
        <select id="gradeLevelSelect" required>
          <option value="" disabled selected>Select Grade Level</option>
          <option value="Kinder">Kinder</option>
          <option value="Grade 1">Grade 1</option>
          <option value="Grade 2">Grade 2</option>
          <option value="Grade 3">Grade 3</option>
          <option value="Grade 4">Grade 4</option>
          <option value="Grade 5">Grade 5</option>
          <option value="Grade 6">Grade 6</option>
          <option value="Grade 7">Grade 7</option>
        </select>
      </div>

      <div class="form-group">
        <label for="section">Section</label>
        <input type="text" id="section" name="section" placeholder="e.g., Section A" required>
      </div>

      <div class="form-group">
        <label for="dateGotSick">Date Got Sick</label>
        <input type="date" id="dateGotSick" name="dateGotSick" required>
      </div>

      <div class="form-group">
        <label for="illness">Illness / Symptoms</label>
        <input type="text" id="illness" name="illness" placeholder="e.g., Fever, Cough" required>
      </div>

      <!-- Month and Week Dropdowns -->
      <div class="row-group">
        <div class="form-group">
          <label for="monthSelect">Month</label>
          <select id="monthSelect" required>
            <option value="" disabled selected>Select Month</option>
            <option value="January">January</option>
            <option value="February">February</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
            <option value="July">July</option>
            <option value="August">August</option>
            <option value="September">September</option>
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
          </select>
        </div>

        <div class="form-group">
          <label for="weekSelect">Week</label>
          <select id="weekSelect" required>
            <option value="" disabled selected>Select Week</option>
            <option value="Week 1">Week 1</option>
            <option value="Week 2">Week 2</option>
            <option value="Week 3">Week 3</option>
            <option value="Week 4">Week 4</option>
            <option value="Week 5">Week 5</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submitBtn">Submit Report</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwwYIBYW0CiaQgMK7N8MdhJ4J_PoNGbLvTte1ZctyFZ-Ot43Ul00-OherCyjd0rGKDK/exec'; // <-- Remember to replace with your Apps Script Web App URL!
    const form = document.getElementById('healthForm');
    const btn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', e => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerText = "Submitting...";
      statusDiv.className = "";
      statusDiv.innerText = "";

      const selectedMonth = document.getElementById('monthSelect').value;
      const selectedWeek = document.getElementById('weekSelect').value;
      const combinedMonthWeek = selectedMonth + " - " + selectedWeek;

      const formData = {
        learnerName: document.getElementById('learnerName').value,
        gradeLevel: document.getElementById('gradeLevelSelect').value,
        section: document.getElementById('section').value,
        dateGotSick: document.getElementById('dateGotSick').value,
        illness: document.getElementById('illness').value,
        monthWeek: combinedMonthWeek
      };

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      })
      .then(() => {
        statusDiv.className = "success";
        statusDiv.innerText = "Health record submitted successfully!";
        form.reset();
        btn.disabled = false;
        btn.innerText = "Submit Report";
      })
      .catch(error => {
        statusDiv.className = "error";
        statusDiv.innerText = "Error! Please try again.";
        btn.disabled = false;
        btn.innerText = "Submit Report";
      });
    });
  </script>
</body>
</html>
